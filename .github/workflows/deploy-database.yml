name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Plan only, or apply migrations after baseline verification'
        type: choice
        options: [plan, deploy]
        default: plan
        required: true
      project_ref:
        description: 'Type xqhxjolkaqqxqblqvrwg to target production'
        required: true

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_DB == 'true'
    runs-on: ubuntu-latest
    environment: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      HARDWARE_DB_DEPLOY: xqhxjolkaqqxqblqvrwg
      HARDWARE_DB_BASELINE_VERIFIED: ${{ vars.HARDWARE_DB_BASELINE_VERIFIED }}
    steps:
      - name: Check target and token
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            test "${{ inputs.project_ref }}" = "$HARDWARE_DB_DEPLOY" || { echo 'Wrong project reference'; exit 1; }
          fi
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN secret'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Show migration status and plan
        run: npm run db:status && npm run db:plan
      - name: Apply pending migrations
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        run: npm run db:deploy
